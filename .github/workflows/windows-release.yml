name: Build Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install app and packaging dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "__version__ = \"${GITHUB_REF_NAME#v}\"" > yap/version.py
      - name: Build portable executable
        run: pyinstaller --noconfirm --clean Yap.spec
      - name: Package download
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item dist/Yap.exe release/Yap.exe
          Copy-Item README.md release/README.txt
          Compress-Archive -Path release/* -DestinationPath Yap-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Yap-Windows-x64
          path: Yap-Windows-x64.zip
          if-no-files-found: error
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: Yap-Windows-x64.zip
